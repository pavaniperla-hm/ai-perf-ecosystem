apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: perf-demo
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        # Run on all nodes including control-plane
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - -config.file=/etc/promtail/config.yml
            - -config.expand-env=true
          env:
            # Override HOSTNAME with the actual node name so promtail's
            # automatic spec.nodeName selector targets the right node
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: LOKI_URL
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: LOKI_USERNAME
            - name: GRAFANA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: GRAFANA_API_TOKEN
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /run/promtail

      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          emptyDir: {}
