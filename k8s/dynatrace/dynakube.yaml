apiVersion: dynatrace.com/v1beta6
kind: DynaKube
metadata:
  name: dynakube
  namespace: dynatrace
  annotations:
    feature.dynatrace.com/automatic-kubernetes-api-monitoring: "true"
spec:
  apiUrl: https://kun86120.live.dynatrace.com/api
  skipCertCheck: false
  # applicationMonitoring injects code modules via CSI driver (no DaemonSet needed).
  # This works on ARM64 nodepool1 where the full OneAgent DaemonSet cannot run.
  # Code modules communicate directly to the ActiveGate — no local socket dependency.
  oneAgent:
    applicationMonitoring: {}
  # ActiveGate pinned to the amd64 monitoring node pool.
  activeGate:
    capabilities:
      - routing
      - kubernetes-monitoring
      - dynatrace-api
    nodeSelector:
      nodepool: monitoring
    tolerations:
      - key: monitoring
        operator: Equal
        value: "true"
        effect: NoSchedule
