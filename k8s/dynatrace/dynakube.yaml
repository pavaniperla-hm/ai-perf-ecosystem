apiVersion: dynatrace.com/v1beta6
kind: DynaKube
metadata:
  name: dynakube
  namespace: dynatrace
  annotations:
    feature.dynatrace.com/automatic-kubernetes-api-monitoring: "true"
spec:
  apiUrl: https://kun86120.live.dynatrace.com/api
  skipCertCheck: false
  # cloudNativeFullStack OneAgent container image is amd64-only and cannot run
  # on this ARM64 node pool. Using applicationMonitoring instead:
  # - No per-node DaemonSet required
  # - Dynatrace webhook injects CodeModules into application pods at startup
  # - Works on ARM64 (injection happens into JVM/Go/Node process, not a separate container)
  oneAgent:
    applicationMonitoring: {}
  # activeGate requires 'activeGateTokenManagement.create' scope on the API token.
  # Add that scope in Dynatrace UI → Access Tokens, then uncomment to enable:
  # activeGate:
  #   capabilities:
  #     - routing
  #     - kubernetes-monitoring
  #     - dynatrace-api
