apiVersion: dynatrace.com/v1beta6
kind: DynaKube
metadata:
  name: dynakube
  namespace: dynatrace
  annotations:
    feature.dynatrace.com/automatic-kubernetes-api-monitoring: "true"
spec:
  apiUrl: https://kun86120.live.dynatrace.com/api
  skipCertCheck: false
  # cloudNativeFullStack schedules OneAgent on every node.
  # Pinned to the amd64 monitoring node pool — ARM64 container images not available.
  oneAgent:
    cloudNativeFullStack:
      nodeSelector:
        nodepool: monitoring
      tolerations:
        - key: monitoring
          operator: Equal
          value: "true"
          effect: NoSchedule
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
  # ActiveGate pinned to the amd64 monitoring node pool.
  activeGate:
    capabilities:
      - routing
      - kubernetes-monitoring
      - dynatrace-api
    nodeSelector:
      nodepool: monitoring
    tolerations:
      - key: monitoring
        operator: Equal
        value: "true"
        effect: NoSchedule
